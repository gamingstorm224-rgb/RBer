<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon!</title>
    <style>
        body {
            background-color: black;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1.25rem;
            text-align: center;
        }

        img {
            max-width: 80%;
            height: auto;
        }

        .update-link {
            color: #ffcc00;
            font-size: 1.25rem;
            font-weight: bold;
            text-decoration: underline;
            transition: color 0.2s ease;
        }

        .update-link:hover {
            color: #ffffff;
        }

        .twitter-btn {
            display: inline-block;
            background-color: #1da1f2;
            color: #ffffff;
            font-weight: bold;
            text-decoration: none;
            padding: 0.6rem 1.4rem;
            border-radius: 6px;
            font-size: 1rem;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .twitter-btn:hover {
            background-color: #0c85d0;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <img src="underconstruction.gif" alt="Coming Soon!">
        <a class="update-link" href="https://gamingstorm224.github.io/gs224-blog" target="_blank" rel="noopener noreferrer">Stay Up To Date</a>
        <a class="twitter-btn" href="https://x.com/stormhdev/" target="_blank" rel="noopener noreferrer">Twitter</a>
    </div>

</body>
</html>
